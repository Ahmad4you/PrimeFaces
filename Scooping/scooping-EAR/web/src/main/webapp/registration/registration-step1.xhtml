<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:p="http://primefaces.org/ui"
	xmlns:f="http://java.sun.com/jsf/core">

<h:head>
	<title>Flow verwalten</title>
</h:head>
<h:body>
	<h:form>
    <h:panelGrid columns="2">
        <h:outputLabel for="username" value="Username:" />
        <h:inputText id="username" value="#{registrationBean.username}" required="true" />

        <h:outputLabel for="email" value="Email:" />
        <h:inputText id="email" value="#{registrationBean.email}" required="true" />
    </h:panelGrid>

    <h:commandButton value="Next" action="#{registrationBean.moveToStep2}" />
</h:form>
</h:body>
</html>
