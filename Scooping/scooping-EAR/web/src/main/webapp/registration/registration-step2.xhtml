<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:p="http://primefaces.org/ui"
	xmlns:f="http://java.sun.com/jsf/core">

<h:head>
	<title>Flow verwalten</title>
</h:head>
<h:body>
	<h:form>
    <h:panelGrid columns="2">
        <h:outputLabel for="password" value="Password:" />
        <h:inputSecret id="password" value="#{registrationBean.password}" required="true" />

        <h:outputLabel for="confirmPassword" value="Confirm Password:" />
        <h:inputSecret id="confirmPassword" value="#{registrationBean.confirmPassword}" required="true" />
    </h:panelGrid>

    <h:commandButton value="Register" action="#{registrationBean.register}" />
</h:form>
</h:body>
</html>
