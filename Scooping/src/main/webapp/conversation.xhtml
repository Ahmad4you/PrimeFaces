<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:p="http://primefaces.org/ui"
	xmlns:f="http://java.sun.com/jsf/core">

<h:head>
	<title>Conversation verwalten</title>
</h:head>
<h:body>
	<h:form>
    <h:inputText value="#{shoppingCartBean.newItem}" />
    <h:commandButton value="Add Item" action="#{shoppingCartBean.addItem}" />
    
    <h:dataTable value="#{shoppingCartBean.items}" var="item">
        <h:column>
            #{item}
        </h:column>
        <h:column>
            <h:commandButton value="Remove" action="#{shoppingCartBean.removeItem(item)}" />
        </h:column>
    </h:dataTable>
    
    <h:commandButton value="Checkout" action="#{shoppingCartBean.checkout}" />
</h:form>
</h:body>
</html>
