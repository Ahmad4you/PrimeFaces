<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
<h:head>
    <title>Obsttabelle mit Icons</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" />
    
</h:head>
<h:body>
    <h:form>
    <h1>Obst Icons</h1>
        <p:dataTable value="#{obstBean.obstListe}" var="obst" styleClass="table">

            <p:column headerText="Obstname">
                <h:outputText value="#{obst.name}" />
            </p:column>

            <p:column headerText="Icon" >
                <i class="#{obst.bootstrapIcon}" style="font-size: 2.5rem; margin-left: 2%;"></i>
            </p:column>
			
			<p:column headerText="Aktion">
            <p:commandButton icon="pi pi-copy"
                             value="Kopieren"
                             update=":eingabeForm"
                             actionListener="#{obstBean.kopiere(obst)}"
                             styleClass="p-button-sm p-button-outlined" />
        </p:column>
        </p:dataTable>
    </h:form>
    <!-- Formular mit 2 Eingabefeldern -->
<h:form id="eingabeForm">
    <p:panel header="Obst-Formular" style="margin-top:20px;">
        <p:inputText value="#{obstBean.feld1}" placeholder="Feld 1" />
        <p:inputText value="#{obstBean.feld2}" placeholder="Feld 2" style="margin-left: 10px;" />
    </p:panel>
</h:form>

    </h:body>
</html>
