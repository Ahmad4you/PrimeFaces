<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
    <h:head>
        <title>Validator simple Beispiel</title>
    </h:head>
    <style>
       .error {
       		color: red;
       }
    </style>
    <h:body>
        <h:form>
         <!-- Name Field mit Bean Validation und Custom Validator -->
            <h:panelGrid columns="3">
                <h:outputLabel for="name" value="Name:" />
                <h:inputText id="name" 
                           value="#{userValidatorBean.name}"
                           validator="#{userValidatorBean.validateName}">
                    <f:validateLength minimum="2" maximum="30" />
                </h:inputText>
                <h:message for="name" style="color: red;" />
                
                <h:outputLabel for="email" value="Email:" />
                <h:inputText id="email" 
                           value="#{userValidatorBean.email}">
                    <f:validateRegex pattern="^[A-Za-z0-9+_.-]+@(.+)$" />
                </h:inputText>
                <h:message for="email" styleClass="error" />
            </h:panelGrid>

            <h:commandButton value="Absenden" action="#{userValidatorBean.submit}" />
        </h:form>
    </h:body>
</html>
