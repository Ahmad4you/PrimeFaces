<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
  <h:head>
    <link rel="stylesheet" type="text/css" media="screen" href="css/style.css"/>
    <title>Artikelverwaltung</title>
  </h:head>
  <h:body>
    <p><img id="kopf_links" src="img/logo.jpg" width="250" alt="Logo"/></p>
    <p id="kopf_rechts">
      <h:outputText value="#{anschrift.name}"/><br />
      <h:outputText value="#{anschrift.strasse} #{anschrift.hausnummer}"/><br />
      <h:outputText value="#{anschrift.plz} #{anschrift.ort}"/>
    </p>
    <h1>Artikelverwaltung</h1>
    <h2>Artikel erfassen</h2>
     <!-- fuer responsive Tabelle darstellung wird leerzeichen hinzugefuegt wenn index = 0 oder maxIndex-->
    <h:form>
      <h:panelGrid columns="2">
        <h:commandLink value="zurück" action="#{artikelController.zurueck}"
                       rendered="#{artikelController.index > 0}"/>
        <h:outputText rendered="#{artikelController.index == 0 or (artikelController.index == artikelController.maxIndex)}" value=" "/>
        
        <h:commandLink value="vor" action="#{artikelController.vor}"
                       rendered="#{artikelController.index lt artikelController.maxIndex}"/>
        <h:outputLabel value="Nr:" for="nr"/>
        <h:outputText id="nr" value="#{artikelController.artikel.id}"/>
        <h:outputLabel value="Name:" for="name"/>
        <h:inputText id="name" value="#{artikelController.artikel.name}" size="40"/>
        <h:outputLabel value="Beschreibung: " for="text"/>
        <h:inputText id="text" value="#{artikelController.artikel.description}" size="40"/>
        <h:outputLabel value="Bild-Datei: " for="bilddatei"/>
        <h:inputText id="bilddatei"  value="#{artikelController.artikel.bild}"  size="40" >
          <f:validateRegex pattern="[a-zA-Z/a-zA-Z]+.(jpg|png|gif|jpeg)" />
		  <p:ajax event="keyup" update="bild" listener="#{artikelController.handleBildKeyEvent}"/>
		</h:inputText>
		
		<h:outputLabel value="Bild-Datei2: " for="bilddatei2"/>
		<p:selectOneMenu id="bilddatei2" value="#{artikelController.selectedBild}">
            <f:selectItems value="#{shop.sortiment}" var="artikel" itemLabel="#{artikel.bild}" itemValue="#{artikel.bild}"/>
          	 <p:ajax event="change" listener="#{artikelController.onBildChange}" update="bild" />
        </p:selectOneMenu>
       
        <h:outputLabel value="Verfügbar ab:" for="verfuegbarAb"/>
        <p:calendar
            id="verfuegbarAb" 
            value="#{artikelController.artikel.verfuegbarAb}" 
            datePattern="dd.MM.yyyy"
            enableManualInput="true">
        </p:calendar>
        <h:outputLabel value="Bild: " for="bild"/>
        <h:graphicImage class="bild" id="bild" url="#{artikelController.artikel.bild}" />
        
      </h:panelGrid>
    </h:form>
    <p id="fussnote">Bitte beachten Sie: <br /> Diese Seite ist nur ein Entwurf!</p>
  </h:body>
</html>
